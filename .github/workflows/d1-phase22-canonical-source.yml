name: D1 Phase22 canonical-source and reference-only offline gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'd1-staging/analysis/phase22-*'
      - 'tests/check-d1-phase22-*'
      - '.github/workflows/d1-phase22-canonical-source.yml'
  push:
    branches: [main]
    paths:
      - 'd1-staging/analysis/phase22-*'
      - 'tests/check-d1-phase22-*'
      - '.github/workflows/d1-phase22-canonical-source.yml'

permissions:
  contents: read

jobs:
  offline-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm 13-tab candidate source and immutable 3-tab legacy reference policy
        run: |
          node --check d1-staging/analysis/phase22-canonical-source-policy.mjs
          node tests/check-d1-phase22-source-policy.mjs
      - name: Verify exact offline-only SQLite ledger balance/legacy archive fence
        run: |
          python3 tests/check-d1-phase22-reference-boundary.py
      - name: Confirm Phase22 has no source credentials, web calls or real D1 migration
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import assert from 'node:assert/strict';
            const source=fs.readFileSync('d1-staging/analysis/phase22-canonical-source-policy.mjs','utf8');
            const schema=fs.readFileSync('d1-staging/analysis/phase22-reference-boundary-offline.sql','utf8');
            assert(!/fetch\\s*\\(|googleapis|cloudflare|wrangler|D1Database|writeFile|spreadsheet_id|authorization|secret|https?:\\/\\//i.test(source));
            assert(!/ATTACH DATABASE|DROP TABLE|REPLACE INTO|D1Database/i.test(schema));
            assert(schema.includes('CREATE VIEW synthetic_active_ledger_only'));
            console.log('PHASE22_NO_EXTERNAL_DATA_ACCESS_PASS');
          "

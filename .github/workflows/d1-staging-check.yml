name: D1 staging offline schema checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'd1-staging/**'
      - 'scripts/d1-staging-*'
      - 'tests/check-d1-business-schema.py'
      - 'tests/check-d1-readonly-pilot.mjs'
      - 'tests/check-d1-phase5-route-parity.cjs'
      - 'tests/check-d1-phase5-schedule.py'
      - 'tests/check-d1-phase5-membership.py'
      - 'tests/check-d1-phase6-civil-codec.py'
      - 'tests/check-d1-phase6-audit-preflight.py'
      - 'tests/check-d1-phase7-offline-replay.py'
      - 'cloudflare-worker/worker.js'
      - 'gas-staging/コード.gs'
      - '.github/workflows/d1-staging-*.yml'
      - 'docs/D1_MIGRATION_PLAN.md'
permissions:
  contents: read
jobs:
  schema-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated migration with SQLite and guard existing Worker
        run: python3 scripts/d1-staging-check.py
      - name: Validate business schema and v15 historical safety contracts
        run: python3 tests/check-d1-business-schema.py
      - name: Validate read-only remote schema contract and no-business-data guard
        run: node scripts/d1-staging-remote-smoke.cjs self-test
      - name: Validate independent D1 Worker read-only pilot with mock binding
        run: node tests/check-d1-readonly-pilot.mjs
      - name: Validate direct D1 REST benchmark and response fail-closed guard
        run: node scripts/d1-staging-http-bench.cjs self-test
      - name: Fail closed for all 47 existing API routes before D1 read migration
        run: node tests/check-d1-phase5-route-parity.cjs
      - name: Offline synthetic schedule list candidate parity with GAS semantics
        run: python3 tests/check-d1-phase5-schedule.py
      - name: Block lossy team membership history import with fabricated duplicate keys
        run: python3 tests/check-d1-phase5-membership.py
      - name: Guard JST Sheets serial-date / time / audit projection with fabricated cells
        run: python3 tests/check-d1-phase6-civil-codec.py
      - name: Reject corrupt audit records and keep withdrawn-actor event history
        run: python3 tests/check-d1-phase6-audit-preflight.py
      - name: Validate fabricated cross-table role and audit replay with rollback
        run: python3 tests/check-d1-phase7-offline-replay.py
      - name: Validate D1 target-account and database guard
        run: node scripts/d1-staging-config.cjs self-test
      - name: Protect legacy ledger confirmation ordering and balances
        run: node tests/check-stage-ledger-confirm-order-v1651.cjs
      - name: Protect LINE attendance and authenticated changes
        run: node tests/check-stage-line-attendance-v1645.cjs
      - name: Protect member withdrawal and rejoin history
        run: node tests/check-stage-withdraw-rejoin-v1653.cjs
      - name: Protect match creation and history
        run: node tests/check-stage-match-create-v1639a.cjs

name: Staging GAS - GitHub / clasp
run-name: Staging GAS ${{ github.event_name == 'push' && 'auto-deploy' || inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'First run preflight (read only); deploy updates the existing GAS web app'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - deploy
      confirmation:
        description: 'For deploy only: type UPDATE_EXISTING_STAGING_GAS'
        type: string
        required: false
  push:
    branches:
      - main
    paths:
      - 'gas-staging/*.gs'
      - 'scripts/gas-staging-guard.cjs'
      - 'scripts/gas-staging-deploy.sh'
      # Bootstrap this policy revision by deploying the already-reviewed GAS source.
      - '.github/workflows/gas-staging.yml'
permissions:
  contents: read
concurrency:
  group: connected-staging-gas-deploy
  cancel-in-progress: false
jobs:
  update-existing-staging-gas:
    # Connected staging is authorized for unattended deployment after merges to main.
    # Production MUST use a separate manual-only workflow and protected environment.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: staging-gas
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate GAS sources without Google access
        run: node tests/check-gas-staging-ci.cjs
      - name: Test remote drift and manifest safety guards
        run: node tests/check-gas-staging-guard.cjs
      - name: Check payment ledger fast path safety
        run: node tests/check-gas-payment-fastpath.cjs
      - name: Test opt-in GAS phase profile
        run: node tests/check-gas-payment-profile.cjs
      - name: Verify cash audit is independent and version checked
        run: node tests/check-stage-cash-reconcile-v1637.cjs
      - name: Verify schedule master preserves IDs, funds, and links
        run: node tests/check-stage-schedule-v1638.cjs
      - name: Verify member-level visitor registration and fee category independence
        run: node tests/check-stage-visitor-v1638b.cjs
      - name: Verify cascading date deletion is archived and settlement-gated
        run: node tests/check-stage-cascade-v1638c.cjs
      - name: Verify participant edits, paid attendance deletion and match safety
        run: node tests/check-stage-participant-v1638d.cjs
      - name: Verify match-session participant reads and manual refresh overlap
        run: node tests/check-stage-participant-refresh-v1638e.cjs
      - name: Verify legacy-v7 participant layout without visitor-add shortcut
        run: node tests/check-stage-participant-v7-layout-v1638f.cjs
      - name: Verify match delete archive, guest revocation and roster unlock
        run: node tests/check-stage-match-delete-v1639.cjs
      - name: Verify match roster count failures and operation modal safety
        run: node tests/check-stage-match-create-v1639a.cjs
      - name: Verify visitor approval, paid rejection and locked-ledger integrity
        run: node tests/check-stage-visitor-approval-v1640.cjs
      - name: Verify visitor choices against confirmed ledger dates
        run: node tests/check-stage-visitor-filter-v1677.cjs
      - name: Verify read-status UI regression safety
        run: node tests/check-stage-foreground-read-v1678.cjs
      - name: Verify visitor delete boundary and role preview isolation
        run: node tests/check-stage-role-preview-visitor-delete-v1679.cjs
      - name: Verify staging self-role mutation owner and backup protection
        run: node tests/check-stage-self-role-v1680.cjs
      - name: Verify 15s timeouts, uncertain mutations and error message standards
        run: node tests/check-stage-timeouts-message-v1681.cjs
      - name: Verify member-only LINE attendance timestamping and financial locks
        run: node tests/check-stage-line-attendance-v1645.cjs
      - name: Verify admin user-name edit and finalized ledger role buttons
        run: node tests/check-stage-member-ledger-v1656.cjs
      - name: Verify LINE kana registration and category/kana roster sort
        run: node tests/check-stage-member-kana-v1657.cjs
      - name: Verify GAS kana approval and account edit against immutable history
        run: node tests/check-stage-member-kana-approval-v1657b.cjs
      - name: Verify stage withdrawal, historical preservation and fresh-ID reapplication
        run: node tests/check-stage-withdraw-rejoin-v1653.cjs
      - name: Verify v15 sequential ledger confirmations including earlier months
        run: node tests/check-stage-ledger-confirm-order-v1651.cjs
      - name: Verify receipt permissions, audited deleted row and payout weekday
        run: node tests/check-stage-receipt-weekday-v1665.cjs
      - name: Verify actual receipt serialization, access and version constraints
        run: node tests/check-stage-receipts-v1665.cjs
      - name: Verify compact operation-history scan preserves idempotency
        run: node tests/check-gas-audit-ids-v1636h.cjs
      - name: Install pinned official Google clasp
        run: npm install --global --no-fund --no-audit --ignore-scripts @google/clasp@3.4.1
      - name: Preflight or update EXISTING staging GAS deployment
        env:
          GAS_ACTION_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
          GAS_ACTION_CONFIRMATION: ${{ github.event_name == 'push' && 'UPDATE_EXISTING_STAGING_GAS' || inputs.confirmation }}
          GAS_STAGE_SCRIPT_ID: ${{ secrets.GAS_STAGE_SCRIPT_ID }}
          GAS_STAGE_DEPLOYMENT_ID: ${{ secrets.GAS_STAGE_DEPLOYMENT_ID }}
          GAS_STAGE_CLASPRC_JSON: ${{ secrets.GAS_STAGE_CLASPRC_JSON }}
        run: bash scripts/gas-staging-deploy.sh

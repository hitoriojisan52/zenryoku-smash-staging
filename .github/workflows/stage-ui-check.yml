name: Connected staging UI regression checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'live.js'
      - 'tests/check-stage-schedule-v1638.cjs'
      - 'tests/check-stage-visitor-v1638b.cjs'
      - 'tests/check-stage-cascade-v1638c.cjs'
      - 'tests/check-stage-participant-v1638d.cjs'
      - 'tests/check-stage-participant-refresh-v1638e.cjs'
      - 'tests/check-stage-participant-v7-layout-v1638f.cjs'
      - 'tests/check-stage-match-delete-v1639.cjs'
      - 'tests/check-stage-match-create-v1639a.cjs'
      - 'tests/check-stage-system-messages-v1639b.cjs'
      - 'tests/check-stage-visitor-approval-v1640.cjs'
      - 'tests/check-stage-visitor-ui-v1641.cjs'
      - 'visitor-approval.js'
      - 'live-access-v2.js'
      - 'live-access-v2.css'
      - 'access-v2-mode.js'
      - 'date-format.js'
      - 'guest.js'
      - 'guest.html'
      - 'match-view.js'
      - 'match-view.html'
      - 'access-ui.js'
      - 'stage-ui.css'
      - 'dialog-close.js'
      - 'match-confirm.js'
      - 'tests/check-stage-dialog-close-v1644.cjs'
      - 'tests/check-stage-dialog-inventory-v1646.cjs'
      - 'tests/check-stage-ledger-add-v1647.cjs'
      - 'tests/check-stage-finance-member-v1648.cjs'
      - 'tests/check-stage-member-ledger-v1656.cjs'
      - 'tests/check-stage-ledger-cards-v1658.cjs'
      - 'tests/check-stage-density-scroll-v1659.cjs'
      - 'tests/check-stage-ui-cleanup-v1660.cjs'
      - 'tests/check-stage-toolbar-dates-v1661.cjs'
      - 'tests/check-stage-compact-controls-v1662.cjs'
      - 'tests/check-stage-visual-delta-v1663.cjs'
      - 'tests/check-stage-upcoming-cash-v1664.cjs'
      - 'tests/check-stage-receipt-weekday-v1665.cjs'
      - 'tests/check-stage-receipts-v1665.cjs'
      - 'tests/check-stage-history-receipt-v1666.cjs'
      - 'tests/check-stage-iphone-receipt-weekday-v1667.cjs'
      - 'tests/check-stage-weekday-jpg10mb-v1668.cjs'
      - 'tests/check-stage-reimbursement-date-drive-v1669.cjs'
      - 'tests/check-stage-drive-consent-v1671.cjs'
      - 'tests/check-stage-finance-guard-v1672.cjs'
      - 'tests/check-stage-receipt-view-close-v1673.cjs'
      - 'tests/check-stage-participant-date-parity-v1674.cjs'
      - 'tests/check-stage-member-kana-v1657.cjs'
      - 'tests/check-stage-member-kana-approval-v1657b.cjs'
      - 'tests/check-stage-ledger-confirm-order-v1651.cjs'
      - 'tests/check-stage-withdraw-boundary.cjs'
      - 'tests/check-stage-withdraw-rejoin-v1653.cjs'
      - 'tests/check-stage-line-attendance-v1645.cjs'
      - 'match.js'
      - 'match.html'
      - 'match.css'
      - 'cash-reconcile.js'
      - 'cloudflare-worker/worker.js'
      - 'tests/check-stage-cash-reconcile-v1637.cjs'
      - 'live.html'
      - 'stage-ui.js'
      - 'tests/check-stage-payment-parallel-v1636f.cjs'
      - 'tests/check-stage-finance-v1636c.cjs'
      - 'tests/check-ui-standards.cjs'
      - '.github/workflows/stage-ui-check.yml'
permissions:
  contents: read
jobs:
  payment-and-ui-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate simultaneous checkboxes, inverse responses, errors and undo
        run: node tests/check-stage-payment-parallel-v1636f.cjs
      - name: Verify cash count, exact-date ledger reconciliation and read-only isolation
        run: node tests/check-stage-cash-reconcile-v1637.cjs
      - name: Verify schedule master fixed-ID controls and referential safety
        run: node tests/check-stage-schedule-v1638.cjs
      - name: Verify authenticated visitor proxy and time-category screens
        run: node tests/check-stage-visitor-v1638b.cjs
      - name: Verify schedule cascade preview, deletion and collection gating
        run: node tests/check-stage-cascade-v1638c.cjs
      - name: Verify participant management and immutable billing safeguards
        run: node tests/check-stage-participant-v1638d.cjs
      - name: Verify roster match session and full-screen manual refresh regression
        run: node tests/check-stage-participant-refresh-v1638e.cjs
      - name: Verify original-v7 participant rows and absence of visitor add
        run: node tests/check-stage-participant-v7-layout-v1638f.cjs
      - name: Verify match deletion is confirmed, backed up and attendance-safe
        run: node tests/check-stage-match-delete-v1639.cjs
      - name: Verify match creation requires registered roster and delete control placement
        run: node tests/check-stage-match-create-v1639a.cjs
      - name: Verify shared system messages across all staging screens
        run: node tests/check-stage-system-messages-v1639b.cjs
      - name: Verify visitor approval and paid-rejection cross-module safety
        run: node tests/check-stage-visitor-approval-v1640.cjs
      - name: Verify visitor request dates, statuses and cross-screen button semantics
        run: node tests/check-stage-visitor-ui-v1641.cjs
      - name: Verify frontend financial state and Worker gating
        run: node tests/check-stage-finance-v1636c.cjs
      - name: Verify common UI standards
        run: node tests/check-ui-standards.cjs
      - name: Verify member-only LINE attendance timestamp and auth recovery
        run: node tests/check-stage-line-attendance-v1645.cjs
      - name: Verify top-right toolbar layout and original Cancel behavior
        run: node tests/check-stage-dialog-close-v1644.cjs
      - name: Verify all 27 dialogs retain every original button and action route
        run: node tests/check-stage-dialog-inventory-v1646.cjs
      - name: Verify ledger Add is enabled after duty/admin login and denied for members
        run: node tests/check-stage-ledger-add-v1647.cjs
      - name: Verify member access cards and future ledger/confirmation safeguards
        run: node tests/check-stage-finance-member-v1648.cjs
      - name: Verify admin name edit, card layout and finalized ledger roles
        run: node tests/check-stage-member-ledger-v1656.cjs
      - name: Verify mobile ledger card UI, green unlock and compact shared buttons
        run: node tests/check-stage-ledger-cards-v1658.cjs
      - name: Verify all-screen density and collection-only participant scrolling
        run: node tests/check-stage-density-scroll-v1659.cjs
      - name: Verify diagnostic cleanup, date metadata, close/title and gray navigation
        run: node tests/check-stage-ui-cleanup-v1660.cjs
      - name: Verify month and list action rows, refresh icons and detailed Japanese date options
        run: node tests/check-stage-toolbar-dates-v1661.cjs
      - name: Verify original-like compact controls and payment/roster memo presentation
        run: node tests/check-stage-compact-controls-v1662.cjs
      - name: Verify active 30px controls, two-row finance footer and corrected visitor/member labels
        run: node tests/check-stage-visual-delta-v1663.cjs
      - name: Verify upcoming-only defaults, grouped menus, compact cash and match copy
        run: node tests/check-stage-upcoming-cash-v1664.cjs
      - name: Verify private receipts, payout weekdays and audited deleted ledger rows
        run: node tests/check-stage-receipt-weekday-v1665.cjs
      - name: Verify real isolated GAS receipt upload/download and audited deletion
        run: node tests/check-stage-receipts-v1665.cjs
      - name: Verify opt-in historical records and non-duplicating receipt recovery
        run: node tests/check-stage-history-receipt-v1666.cjs
      - name: Verify iPhone HEIC/JPG normalization and native inline date weekday
        run: node tests/check-stage-iphone-receipt-weekday-v1667.cjs
      - name: Verify near-date weekday and 10 MB JPG selected-photo processing
        run: node tests/check-stage-weekday-jpg10mb-v1668.cjs
      - name: Verify backdated confirmed-ledger errors and schedule inline weekday
        run: node tests/check-stage-reimbursement-date-drive-v1669.cjs
      - name: Verify manual stage-only Drive OAuth consent prompt
        run: node tests/check-stage-drive-consent-v1671.cjs
      - name: Verify finance chronology, no practice ledger delete and collection/receipt changes
        run: node tests/check-stage-finance-guard-v1672.cjs
      - name: Verify in-app receipt preview and normal upper-right Close
        run: node tests/check-stage-receipt-view-close-v1673.cjs
      - name: Verify collection and participant date parity, confirmed today and JST midnight
        run: node tests/check-stage-participant-date-parity-v1674.cjs
      - name: Verify LINE registration kana and unified roster sort
        run: node tests/check-stage-member-kana-v1657.cjs
      - name: Verify real GAS kana approval/edit and historical safety
        run: node tests/check-stage-member-kana-approval-v1657b.cjs
      - name: Verify v15 strictly sequential ledger confirmation and earlier-month blockers
        run: node tests/check-stage-ledger-confirm-order-v1651.cjs
      - name: Verify staging withdrawal remains isolated
        run: node tests/check-stage-withdraw-boundary.cjs
      - name: Verify end-to-end withdrawal and reapplication in mocked Sheets
        run: node tests/check-stage-withdraw-rejoin-v1653.cjs
      - name: Verify GAS payment timing without extra sheet writes
        run: node tests/check-gas-payment-profile.cjs

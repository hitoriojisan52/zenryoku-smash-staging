<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>全力☆スマッシュ｜利用申請</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="stage-ui.css?v=1684-status-contract">
<link rel="stylesheet" href="register.css?v=1684-standalone">
</head>
<body class="stage-ui">
<main class="container registration-shell">
 <header class="app-header">
  <h1>📝 利用申請</h1>
  <button id="registrationClose" class="btn-outline" type="button">✕ 閉じる</button>
 </header>
 <p class="registration-description">全力☆スマッシュの利用申請画面です。登録状況はLINEアカウントで自動確認します。</p>
 <p id="registrationStatus" class="stage-system-message stage-system-message--info stage-inline-read-loading" role="status" aria-live="polite" aria-atomic="true">LINE認証を確認しています…</p>
 <form id="registrationForm" hidden autocomplete="on">
  <label for="registrationName" class="dialog-label">氏名</label>
  <input id="registrationName" class="dialog-input" type="text" maxlength="30" autocomplete="name" placeholder="例：全力太郎" required>
  <label for="registrationKana" class="dialog-label">氏名カナ（全角カタカナ）</label>
  <input id="registrationKana" class="dialog-input" type="text" maxlength="60" placeholder="例：ゼンリョクタロウ" required>
  <button id="registrationSubmit" type="submit" class="btn-green">利用申請する</button>
 </form>
 <button id="registrationRefresh" class="btn-blue" type="button" disabled>🔄 更新</button>
</main>
<dialog id="registrationConfirm" aria-labelledby="registrationConfirmTitle" aria-describedby="registrationConfirmText">
 <h2 id="registrationConfirmTitle">利用申請の確認</h2>
 <p id="registrationConfirmText">入力した氏名で利用申請しますか？</p>
 <div class="modal-actions">
  <button id="registrationCancel" type="button" class="btn-outline">キャンセル</button>
  <button id="registrationConfirmSave" type="button" class="btn-green">申請する</button>
 </div>
</dialog>
<dialog id="registrationError" aria-labelledby="registrationErrorTitle" aria-describedby="registrationErrorText" role="alertdialog">
 <h2 id="registrationErrorTitle">処理できませんでした</h2>
 <p id="registrationErrorText" class="stage-system-message stage-system-message--error" role="alert"></p>
 <div class="modal-actions"><button id="registrationErrorClose" type="button" class="btn-outline">閉じる</button></div>
</dialog>
<script src="runtime-config.js?v=1684-registration"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="register.js?v=1684-standalone"></script>
</body>
</html>

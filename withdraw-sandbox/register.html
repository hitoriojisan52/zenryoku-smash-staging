<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>全力☆スマッシュ｜登録申請・退会検証</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../access.css"><link rel="stylesheet" href="./sandbox.css"></head>
<body><main class="sb-shell">
 <p class="sb-eyebrow">ISOLATED TEST / REGISTRATION</p>
 <h1>🏸 メンバー登録申請</h1>
 <div class="sb-notice">これは退会検証専用コピーに接続する画面です。本番の申請には使用しないでください。</div>
 <p id="connectionStatus" class="sb-status" role="status">LINEログインを準備しています…</p>
 <section id="accessRegistration" class="sb-card access-panel" hidden>
  <h2>メンバー登録申請</h2>
  <p>初回利用者は表示名を入力して申請します。承認待ち・登録済みの場合は状態を表示します。</p>
  <label for="accessRegName">表示名</label><input id="accessRegName" type="text" maxlength="30" placeholder="例：全力太郎" autocomplete="name">
  <button id="accessApply" type="button" class="btn-blue" disabled>登録を申請する</button>
 </section>
 <p id="accessMessage" role="status" aria-live="polite"></p>
 <div id="accessQrHeader" hidden><button id="accessQrButton" type="button" hidden>使用しない</button></div>
 <section id="accessShare" hidden><div id="accessQr"></div><input id="accessShareUrl"><span id="accessShareExpiry"></span><button id="accessQrCopy">コピー</button><button id="accessShareClose">閉じる</button></section>
 <p class="sb-meta"><a href="./">検証用トップページ</a></p>
</main>
<script src="./config.js"></script><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./api.js"></script><script src="./access-ui.js"></script><script src="./register.js"></script>
</body></html>

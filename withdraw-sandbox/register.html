<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>全力☆スマッシュ｜登録申請・退会検証</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../access.css"><link rel="stylesheet" href="./sandbox.css?v=1616"></head>
<body><main class="container sb-shell">
 
 <header class="app-header"><h1>🏸 メンバー登録</h1> <small class="demo-label">接続試験</small></header>
 <p class="sb-test-label">テスト用の画面です</p>
 <p id="connectionStatus" class="sb-status" role="status">準備中です…</p>
 <button id="retryConnection" type="button" class="btn-outline" hidden>やり直す</button>
 <section id="accessRegistration" class="sb-card" hidden>
  <h2>登録状況</h2>
  <p id="accessMessage" role="status" aria-live="polite">確認中です…</p>
  <div id="accessEntry" hidden>
   <label for="accessRegName">お名前</label>
   <input id="accessRegName" class="dialog-input" type="text" maxlength="30" placeholder="例：全力太郎" autocomplete="name">
   <button id="accessApply" type="button" class="btn-blue" disabled>登録を申し込む</button>
  </div>
 </section>
 
</main><dialog id="confirmActionDialog" aria-labelledby="confirmActionTitle" aria-describedby="confirmActionText">
<h2 id="confirmActionTitle">確認</h2><p id="confirmActionText"></p>
<div class="modal-actions"><button type="button" id="cancelConfirmAction" class="btn-outline">キャンセル</button><button type="button" id="doConfirmAction" class="btn-blue">実行する</button></div>
</dialog><div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div><dialog id="sandboxBusyDialog" class="sb-busy-dialog" aria-modal="true" aria-labelledby="sandboxBusyText" aria-describedby="sandboxBusyHelp">
  <div class="sb-busy-content">
    <div class="sb-spinner" aria-hidden="true"></div>
    <strong id="sandboxBusyText">処理中です…</strong>
    <span id="sandboxBusyHelp">処理が完了するまで操作できません</span>
  </div>
</dialog>
<script src="./config.js"></script><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./api.js?v=1614a"></script><script src="./sandbox-dialog.js?v=1614a"></script><script src="./access-ui.js?v=1616"></script><script src="./register.js?v=1616"></script>
</body></html>
